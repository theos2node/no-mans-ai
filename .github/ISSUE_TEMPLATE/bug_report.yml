name: Bug report
description: Report a reproducible problem in the live office or deterministic runner.
title: "[Bug]: "
labels:
  - bug
body:
  - type: dropdown
    id: mode
    attributes:
      label: Execution mode
      options:
        - Deterministic experiment
        - Live office
        - Operator UI
    validations:
      required: true
  - type: textarea
    id: behavior
    attributes:
      label: What happened?
      description: Include the expected behavior and the actual behavior.
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: Reproduction
      description: Include commands, scenario, seed, run ID, or a minimal event stream.
    validations:
      required: true
  - type: input
    id: node
    attributes:
      label: Node.js version
      placeholder: "22.18.0"
    validations:
      required: true
  - type: textarea
    id: notes
    attributes:
      label: Additional context
      description: Remove API keys, personal data, and private vault content before posting.
